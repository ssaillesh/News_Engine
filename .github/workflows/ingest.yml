name: Scheduled ingest

# The archive only advances when this runs. Every 3 hours keeps the RSS sources
# (which carry only recent items) from rolling over between runs.
#
# NOTE: GitHub disables scheduled workflows after 60 days with no repo activity.
# Re-enable from the Actions tab, or push any commit, to restart the schedule.
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

concurrency:
  # A slow run must never overlap the next slot — the same guarantee the local
  # script gets from its lock directory.
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}
      ARCHIVER_ENV: prod
      # Nothing is committed, so keep the repo's .env out of the resolution
      # chain entirely and read config from the environment only.
      ARCHIVER_ENV_FILE: /dev/null
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[postgres]"

      - name: Fail fast if DATABASE_URL is unset
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret is not set — add it under Settings → Secrets → Actions."
            exit 1
          fi

      - name: Apply migrations
        run: alembic upgrade head

      # RSS sources self-bound (feeds carry only recent items). Federal Register
      # needs --incremental or it refetches all ~1700 documents back to 2017.
      - name: Ingest news
        run: archiver ingest-news
      - name: Ingest publishers
        run: archiver ingest-publishers
      - name: Ingest presidential documents
        run: archiver ingest-presidential-documents
      - name: Ingest federal register
        run: archiver ingest-federal-register --incremental
      - name: Ingest White House
        run: archiver ingest-white-house

      # The list endpoint returns titles only, so an archived executive order is
      # ~90 characters and names no company. Capped per run so the job stays
      # inside its timeout; it is resumable, so the backlog drains over a day
      # and steady-state is just the handful of new documents.
      - name: Backfill Federal Register full text
        run: archiver backfill-federal-register-text --limit 400

      # Offline enrichment: curated lexicons + regex, no model downloads, a few
      # seconds over the whole archive. Cheap enough to belong here rather than
      # in the heavy `enrich` workflow, and incremental after the first pass.
      - name: Detect company mentions
        run: archiver detect-stocks
      - name: Classify sectors, topics, stance, and impact
        run: archiver classify
      - name: Refresh quotes for mentioned companies
        run: archiver refresh-market
        continue-on-error: true   # a third-party quote API must not fail the ingest
