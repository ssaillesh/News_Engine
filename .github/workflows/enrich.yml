name: Sentiment & summaries

# Split from ingest because this stack is heavy: torch + transformers is ~500 MB
# and the models are downloaded per run. Ingest stays fast; enrichment runs
# once a day over whatever has accumulated.
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

concurrency:
  group: enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ARCHIVER_ENV: prod
      ARCHIVER_ENV_FILE: /dev/null
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (CPU-only torch — the GPU wheels are gigabytes larger)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[postgres,sentiment]"

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-finbert-distilbart

      - name: Score sentiment
        run: archiver score-sentiment

      - name: Summarize
        run: archiver summarize
