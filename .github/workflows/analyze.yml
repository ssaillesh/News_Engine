name: Story analysis

# Free, key-less detailed analysis: an open-source model (Qwen3 4B, Apache-2.0)
# served by Ollama on the standard CPU runner, writing breakdowns for the newest
# stories ahead of time. Offset 40 minutes from the ingest schedule so new
# stories are already classified.
on:
  schedule:
    - cron: "40 */3 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Most analyses to write"
        default: "6"

concurrency:
  group: analyze
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ARCHIVER_ENV: prod
      ARCHIVER_ENV_FILE: /dev/null
      OLLAMA_VERSION: v0.34.0          # pinned; bump deliberately
      LOCAL_ANALYSIS_MODEL: qwen3:4b
      OLLAMA_MODELS: /home/runner/.ollama/models
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[postgres]"

      - name: Fail fast if DATABASE_URL is unset
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret is not set."
            exit 1
          fi

      - name: Cache Ollama
        id: ollama-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/ollama
          key: ollama-${{ env.OLLAMA_VERSION }}-linux-amd64-cpu

      - name: Install Ollama (pinned release)
        if: steps.ollama-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/ollama.tar.zst \
            "https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst"
          mkdir -p /home/runner/ollama
          tar --zstd -xf /tmp/ollama.tar.zst -C /home/runner/ollama
          rm /tmp/ollama.tar.zst
          # The runner has no GPU and only 14 GB of disk: drop GPU backends.
          find /home/runner/ollama/lib -maxdepth 2 -type d \
            \( -iname '*cuda*' -o -iname '*rocm*' -o -iname '*vulkan*' -o -iname '*mlx*' \) \
            -exec rm -rf {} + 2>/dev/null || true
          du -sh /home/runner/ollama

      - name: Cache model
        uses: actions/cache@v4
        with:
          path: /home/runner/.ollama/models
          key: ollama-model-${{ env.LOCAL_ANALYSIS_MODEL }}

      - name: Start Ollama and pull the model
        run: |
          /home/runner/ollama/bin/ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://127.0.0.1:11434/api/version && break
            sleep 1
          done
          /home/runner/ollama/bin/ollama pull "$LOCAL_ANALYSIS_MODEL"
          df -h /home/runner | tail -1

      - name: Apply migrations
        run: alembic upgrade head

      - name: Write analyses
        run: archiver write-analyses --limit "${{ github.event.inputs.limit || '6' }}" --max-minutes 45

      - name: Ollama log (on failure)
        if: failure()
        run: tail -50 /tmp/ollama.log || true
