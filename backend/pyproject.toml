[project]
name = "stock-research-backend"
version = "0.1.0"
description = "Stock research API — securities, prices, earnings, ratings, news, predictions."
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy[asyncio]>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "celery>=5.4",
  "redis>=5.0",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# This is an application, not a library: only the importable app packages ship.
# `alembic/` is a migration script directory, not a package.
[tool.setuptools.packages.find]
include = ["app*", "workers*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
